name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .[dev]
      - run: python -m ruff check src tests examples scripts
      - name: Report nlpsol plugins (bonmin tests skip when it is missing)
        run: |
          python -c "import casadi as ca; print(ca.__version__, {n: ca.has_nlpsol(n) for n in ('ipopt', 'bonmin', 'sqpmethod', 'fatrop')})"
      - run: python -m pytest -rs
      - name: Params fixture table passes machina params check
        run: make check-params
      - name: Two processes build byte-identical artifacts
        run: make determinism
