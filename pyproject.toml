[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "machina-v2"
version = "0.1.0"
description = "Generic space mission optimization framework using CasADi/IPOPT"
requires-python = ">=3.10"
dependencies = [
    "casadi>=3.6",
    "numpy>=1.24",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "matplotlib>=3.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["."]
markers = [
    "requires_casadi: test requires CasADi to be installed",
]

[tool.setuptools.packages.find]
include = ["machina*"]